spring.application.name=topic-admin-service
server.port=${SERVER_PORT:8092}

# Kafka (3 brokers). En AWS: KAFKA_BOOTSTRAP=<ip-privada>:9092,<ip-privada>:9093,<ip-privada>:9094
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092,localhost:9093,localhost:9094}
# Si el clúster aún no está arriba el servicio arranca igual y los endpoints responden 503.
spring.kafka.admin.fail-fast=false
spring.kafka.admin.properties.request.timeout.ms=5000
spring.kafka.admin.properties.default.api.timeout.ms=8000

# Tópicos que se crean al arrancar (si no existen). Para cambiar la retención de uno ya creado usar la API.
# 3 particiones / 3 réplicas / min.insync.replicas=2 (lo que pide el enunciado).
topic-admin.topics[0].name=pcb.business.events
topic-admin.topics[0].retention-ms=604800000
topic-admin.topics[1].name=pcb.audit.events
topic-admin.topics[1].retention-ms=2592000000
topic-admin.topics[2].name=pcb.business.events.dlt
topic-admin.topics[2].retention-ms=1209600000
topic-admin.topics[3].name=pcb.audit.events.dlt
topic-admin.topics[3].retention-ms=1209600000

management.endpoints.web.exposure.include=health,info
